    <style>
      /* ============================================================
         Anti-fausse-manip pour les enfants
         ============================================================ */
      html, body {
        /* Désactive le pull-to-refresh d'Android Chrome */
        overscroll-behavior-y: contain;
        overscroll-behavior-x: contain;
        /* Pas de zoom involontaire au double-tap */
        touch-action: manipulation;
        /* Pas de sélection de texte par appui long */
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
      }
      input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ============================================================
         PWA temporairement désactivée.
         Ce script DÉSENREGISTRE tout Service Worker déjà installé
         chez les utilisateurs qui avaient visité le site quand le
         PWA était actif. Sans ça, leur ancien SW continuerait de
         tourner et de mettre en cache. À RETIRER quand on remettra
         le PWA en place.
         ============================================================ -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((reg) => reg.unregister());
        }).catch(() => {});
      }
    </script>
  </body>
</html>
