<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#FF8FB1" />

    <!-- Manifest PWA : rend l'app installable sur l'écran d'accueil.
         IMPORTANT : on N'enregistre AUCUN Service Worker (voir plus bas).
         C'est exactement la recette de GeoDojo, qui est installable SANS
         déclencher l'avertissement Play Protect. Le Service Worker était
         le coupable du warning "Appli non sécurisée" — on s'en passe. -->
    <link rel="manifest" href="/manifest.json" />

    <title>ClicJeu — 11 jeux pour 2 joueurs</title>
    <meta name="description" content="Joue à 11 mini-jeux fun avec un ami : Tic Tac Toe, Puissance 4, Pendu, Échecs, Math Duel, Géo Quiz, Pierre Feuille Ciseaux, Course au trésor, Culture G, Mots Mêlés et Dominos." />

    <!-- Carte de partage (WhatsApp, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clicjeu.com/" />
    <meta property="og:title" content="ClicJeu — 11 jeux pour 2 joueurs" />
    <meta property="og:description" content="Joue à 11 mini-jeux fun avec un ami : Tic Tac Toe, Puissance 4, Pendu, Échecs, Math Duel, Géo Quiz, Pierre Feuille Ciseaux, Course au trésor, Culture G, Mots Mêlés et Dominos." />
    <meta property="og:image" content="https://clicjeu.com/logo.svg" />

    <!-- Carte de partage Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClicJeu — 11 jeux pour 2 joueurs" />
    <meta name="twitter:description" content="Joue à 11 mini-jeux fun avec un ami." />
    <meta name="twitter:image" content="https://clicjeu.com/logo.svg" />

    <style>
      /* ============================================================
         Anti-fausse-manip pour les enfants
         ============================================================ */
      html, body {
        /* Désactive le pull-to-refresh d'Android Chrome */
        overscroll-behavior-y: contain;
        overscroll-behavior-x: contain;
        /* Pas de zoom involontaire au double-tap */
        touch-action: manipulation;
        /* Pas de sélection de texte par appui long */
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
      }
      input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ============================================================
         PAS de Service Worker — par choix.
         ClicJeu est installable (manifest ci-dessus) mais SANS Service
         Worker, car c'est le SW qui déclenchait l'avertissement Play
         Protect "Appli non sécurisée" sur Android/Samsung. GeoDojo, qui
         marche sans warning, fonctionne exactement ainsi (manifest seul).
         Comme ClicJeu est un jeu multijoueur temps réel, il a besoin
         d'internet de toute façon : on ne perd rien sans SW (et en bonus,
         aucun souci de cache).

         Ce script désenregistre tout ancien SW resté chez les utilisateurs
         qui avaient l'ancienne version. À GARDER.
         ============================================================ -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((reg) => reg.unregister());
        }).catch(() => {});
      }
    </script>
  </body>
</html>
