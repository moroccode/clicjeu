    <style>
      /* ============================================================
         Anti-fausse-manip pour les enfants
         ============================================================ */
      html, body {
        /* Désactive le pull-to-refresh d'Android Chrome
           (le geste de tirer vers le bas pour recharger la page) */
        overscroll-behavior-y: contain;
        overscroll-behavior-x: contain;
        /* Pas de zoom involontaire au double-tap */
        touch-action: manipulation;
        /* Pas de sélection de texte par appui long → pas de menu contextuel
           qui s'ouvre quand un enfant garde le doigt appuyé */
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        /* Pas de bounce iOS quand on dépasse en haut/bas */
        overflow-x: hidden;
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
      }
      /* Les inputs gardent la sélection (sinon on ne peut plus rien taper) */
      input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
