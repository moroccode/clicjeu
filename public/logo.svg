<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#5C4A3D" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Cercle de fond -->
  <circle cx="200" cy="140" r="130" fill="#B8E6D9" />

  <!-- Étoiles décoratives -->
  <path d="M 95,55 L 98,61 L 105,62 L 100,67 L 101,74 L 95,70 L 89,74 L 90,67 L 85,62 L 92,61 Z" fill="#FFE6F0" opacity="0.9"/>
  <path d="M 305,75 L 308,81 L 315,82 L 310,87 L 311,94 L 305,90 L 299,94 L 300,87 L 295,82 L 302,81 Z" fill="#FFD4B8" opacity="0.9"/>

  <!-- Petit cœur au-dessus -->
  <path d="M 200,38 C 200,33 210,33 210,38 C 210,43 200,50 200,50 C 200,50 190,43 190,38 C 190,33 200,33 200,38 Z" fill="#FFC5D6" />

  <!-- Manette de jeu (corps) -->
  <g filter="url(#soft-shadow)">
    <path d="M 120,100 
             C 140,80 260,80 280,100 
             C 300,120 310,160 290,180 
             C 275,195 250,165 240,160 
             C 220,155 180,155 160,160 
             C 150,165 125,195 110,180 
             C 90,160 100,120 120,100 Z" 
          fill="#FFFFFF" stroke="#5C4A3D" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- D-pad (croix de direction) -->
  <path d="M 135,125 H 145 V 115 H 153 V 125 H 163 V 133 H 153 V 143 H 145 V 133 H 135 Z" fill="#DCC5F7" stroke="#5C4A3D" stroke-width="2" />

  <!-- 4 boutons de droite -->
  <circle cx="245" cy="134" r="5" fill="#FFC5D6" stroke="#5C4A3D" stroke-width="1.5" />
  <circle cx="257" cy="122" r="5" fill="#C5DDF5" stroke="#5C4A3D" stroke-width="1.5" />
  <circle cx="269" cy="134" r="5" fill="#FFE89E" stroke="#5C4A3D" stroke-width="1.5" />
  <circle cx="257" cy="146" r="5" fill="#B8E6D9" stroke="#5C4A3D" stroke-width="1.5" />

  <!-- Visage Kawaii au milieu -->
  <circle cx="185" cy="125" r="3" fill="#5C4A3D" />
  <circle cx="215" cy="125" r="3" fill="#5C4A3D" />
  <path d="M 197,128 Q 200,131 203,128" fill="none" stroke="#5C4A3D" stroke-width="2" stroke-linecap="round" />
  <circle cx="178" cy="130" r="4" fill="#FF8FB1" opacity="0.6" />
  <circle cx="222" cy="130" r="4" fill="#FF8FB1" opacity="0.6" />

  <!-- Curseur fléché qui clique sur la manette -->
  <g filter="url(#soft-shadow)" transform="translate(225, 135)">
    <path d="M 0,0 L 40,25 L 23,28 L 35,52 L 23,57 L 11,33 L 0,42 Z" fill="#FFD4B8" stroke="#5C4A3D" stroke-width="3" stroke-linejoin="round" />
    <circle cx="13" cy="22" r="2" fill="#5C4A3D" />
    <circle cx="23" cy="26" r="2" fill="#5C4A3D" />
  </g>
</svg>

